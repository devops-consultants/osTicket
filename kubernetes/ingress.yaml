apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: osticket-ingress
  namespace: osticket
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "32m"
spec:
  rules:
  - host: osticket.example.com  # Replace with your actual domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: osticket
            port:
              number: 80
