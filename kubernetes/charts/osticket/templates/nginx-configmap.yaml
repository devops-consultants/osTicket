apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "osticket.fullname" . }}-nginx-config
  labels:
    {{- include "osticket.labels" . | nindent 4 }}
data:
  default.conf: |-
    server {
      listen 80;
      server_name _;
      root /var/www/html;
      index index.php;

      client_max_body_size 32M;

      # Security headers
      add_header X-Content-Type-Options nosniff always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header X-Frame-Options "SAMEORIGIN" always;

      # Logging
      # access_log /var/log/nginx/osticket-access.log;
      # error_log /var/log/nginx/osticket-error.log error;

      # Block access to sensitive files
      location ~ /\.ht {
          deny all;
      }

      location ~ /include {
          deny all;
          return 403;
      }

      # Set path info for API
      set $path_info "";
      
      if ($request_uri ~ "^/api(/[^\?]+)") {
          set $path_info $1;
      }

      location /api {
          try_files $uri $uri/ /api/http.php?$query_string;
      }

      # Set path info for SCP
      if ($request_uri ~ "^/scp/.*\.php(/[^\?]+)") {
          set $path_info $1;
      }

      location ~ ^/scp/ajax.php/.*$ {
          try_files $uri $uri/ /scp/ajax.php?$query_string;
      }

      # Handle PHP files
      location ~ \.php$ {
          fastcgi_pass localhost:9000;
          fastcgi_index index.php;
          fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
          include fastcgi_params;
          fastcgi_param PATH_INFO $path_info;
      }

      # Try static files first, then index.php
      location / {
          try_files $uri $uri/ /index.php?$query_string;
      }
    }
